version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mimic_rl}
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"

  app:
    build: .
    volumes:
      - .:/app
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-mimic_rl}
      - MIMIC_DATA_PATH=/app/data/raw
      - WANDB_API_KEY=${WANDB_API_KEY}
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  postgres_data:
